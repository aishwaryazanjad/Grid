
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Collage</title>
    <link rel="stylesheet" href="Image Collage.css">
</head>
<body>

    <h2>Animal Image Collage</h2>

    <div class="animal-grid">
        <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=400" alt="Cat">
        <img src="https://images.unsplash.com/photo-1551717743-49959800b1f6?w=400" alt="Dog">
        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400" alt="Dog">
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" alt="Cat">
        <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=400" alt="Animal">
    </div>

    <h2>Landscape Collage</h2>

    <div class="landscape-grid">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Mountain">
        <div class="landscape-text">
            <h3>Explore The Nature</h3>
            <p>Discover beautiful places and enjoy the beauty of nature.</p>
        </div>
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest">
    </div>

    <h2>3 × 3 Image Gallery</h2>

    <div class="photo-grid">
        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300" alt="Portrait 1">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300" alt="Portrait 2">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Portrait 3">
        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=300" alt="Portrait 4">
        <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=300" alt="Portrait 5">
        <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=300" alt="Portrait 6">
        <img src="https://images.unsplash.com/photo-1504593811423-6dd665756598?w=300" alt="Portrait 7">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300" alt="Portrait 8">
        <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=300" alt="Portrait 9">
    </div>

</body>
</html>
